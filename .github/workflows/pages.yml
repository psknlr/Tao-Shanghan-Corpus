name: Deploy corpus explorer to GitHub Pages

# Every push to main redeploys. An earlier version filtered by path, which meant
# a commit touching only another workflow file left the published site stale
# with no visible signal that nothing had run. The build takes about a minute,
# so the filter cost more in confusion than it saved.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The site payloads are derived from the released layers at build time so
      # the deployed page can never drift from the data in the repository.
      - name: Derive the site payloads
        run: python3 scripts/build_demo_data.py

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      # enablement creates the Pages site through the API when the repository
      # does not have one yet, so a fresh clone or fork deploys without anyone
      # having to set the publishing source in the repository settings first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
